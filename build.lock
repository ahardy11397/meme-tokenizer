      "canonical_meme": "use keywords\nuse lexer\nfunction print_usage() -> Void:\n    print \"Usage: tokenizer <command> [args]\"\n    print \"Commands:\"\n    print \"  tokenize <file.meme> -o <out.json>   Write token stream as JSON to file\"\n    print \"  tokens <file.meme>                   Print human-readable table of tokens\"\n    print \"  count <file.meme>                    Print summary of tokens and line counts\"\nfunction run_cli() -> Void:\n    define argc: Int as argument count\n    if argc < 2:\n        call print_usage()\n        exit with code 1\n    define cmd: String as argument 1\n    if cmd == \"tokenize\":\n        if argc != 5 or argument 3 != \"-o\":\n            print error \"Usage: tokenizer tokenize <file.meme> -o <out.json>\"\n            exit with code 1\n        define in_path: String as argument 2\n        define out_path: String as argument 4\n        define tokens_opt: Optional<List<Token>> as tokenize_file(in_path)\n        if tokens_opt is nothing:\n            print error \"Error: cannot read file: \", in_path\n            exit with code 1\n        define list tokens as value of tokens_opt\n        if token_has_error(tokens):\n            print error token_error_message(tokens)\n            exit with code 1\n        if out_path contains \"/\":\n            create directory \"data\"\n        write tokens as json to file out_path\n        exit with code 0\n    if cmd == \"tokens\":\n        if argc != 3:\n            print error \"Usage: tokenizer tokens <file.meme>\"\n            exit with code 1\n        define in_path: String as argument 2\n        define tokens_opt: Optional<List<Token>> as tokenize_file(in_path)\n        if tokens_opt is nothing:\n            print error \"Error: cannot read file: \", in_path\n            exit with code 1\n        define list tokens as value of tokens_opt\n        if token_has_error(tokens):\n            print error token_error_message(tokens)\n            exit with code 1\n        for each tok in tokens:\n            print tok.line, tok.col, tok.kind, tok.value\n        exit with code 0\n    if cmd == \"count\":\n        if argc != 3:\n            print error \"Usage: tokenizer count <file.meme>\"\n            exit with code 1\n        define in_path: String as argument 2\n        define content_opt: Optional<String> as read string from file in_path or else nothing\n        if content_opt is nothing:\n            print error \"Error: cannot read file: \", in_path\n            exit with code 1\n        define content: String as value of content_opt\n        define list tokens as tokenize(content)\n        if token_has_error(tokens):\n            print error token_error_message(tokens)\n            exit with code 1\n        define num_lines: Int as 0\n        if length of string content > 0:\n            define list raw_lines as split content by \"\\n\"\n            set num_lines to length of raw_lines\n        define count_kw: Int as 0\n        define count_id: Int as 0\n        define count_int: Int as 0\n        define count_float: Int as 0\n        define count_str: Int as 0\n        define count_op: Int as 0\n        define count_com: Int as 0\n        for each tok in tokens:\n            if tok.kind == \"keyword\":\n                set count_kw to count_kw + 1\n            else:\n                if tok.kind == \"identifier\":\n                    set count_id to count_id + 1\n                else:\n                    if tok.kind == \"int\":\n                        set count_int to count_int + 1\n                    else:\n                        if tok.kind == \"float\":\n                            set count_float to count_float + 1\n                        else:\n                            if tok.kind == \"string\":\n                                set count_str to count_str + 1\n                            else:\n                                if tok.kind == \"operator\":\n                                    set count_op to count_op + 1\n                                else:\n                                    if tok.kind == \"comment\":\n                                        set count_com to count_com + 1\n        print \"Total tokens:\", length of tokens\n        print \"Total lines:\", num_lines\n        print \"keyword:\", count_kw\n        print \"identifier:\", count_id\n        print \"int:\", count_int\n        print \"float:\", count_float\n        print \"string:\", count_str\n        print \"operator:\", count_op\n        print \"comment:\", count_com\n        exit with code 0\n    print error \"Unknown command: \", cmd\n    call print_usage()\n    exit with code 1\ncall run_cli()",
