      "canonical_meme": "use ../../lexer\ntest int_literals_test:\n    define list toks as tokenize(\"42 0 1000 999999\")\n    assert length of toks == 4\n    define t0: Token as toks[0]\n    assert t0.kind == \"int\"\n    assert t0.value == \"42\"\n    define t1: Token as toks[1]\n    assert t1.kind == \"int\"\n    assert t1.value == \"0\"\n    define t2: Token as toks[2]\n    assert t2.kind == \"int\"\n    assert t2.value == \"1000\"\n    define t3: Token as toks[3]\n    assert t3.kind == \"int\"\n    assert t3.value == \"999999\"\ntest float_literals_test:\n    define list toks as tokenize(\"3.14 0.0 123.456 99.001\")\n    assert length of toks == 4\n    define t0: Token as toks[0]\n    assert t0.kind == \"float\"\n    assert t0.value == \"3.14\"\n    define t1: Token as toks[1]\n    assert t1.kind == \"float\"\n    assert t1.value == \"0.0\"\n    define t2: Token as toks[2]\n    assert t2.kind == \"float\"\n    assert t2.value == \"123.456\"\n    define t3: Token as toks[3]\n    assert t3.kind == \"float\"\n    assert t3.value == \"99.001\"\ntest dot_rule_int_followed_by_dot_test:\n    define list toks1 as tokenize(\"1.\")\n    assert length of toks1 == 2\n    define a0: Token as toks1[0]\n    assert a0.kind == \"int\"\n    assert a0.value == \"1\"\n    define a1: Token as toks1[1]\n    assert a1.kind == \"operator\"\n    assert a1.value == \".\"\n    define list toks2 as tokenize(\"1.foo\")\n    assert length of toks2 == 3\n    define b0: Token as toks2[0]\n    assert b0.kind == \"int\"\n    assert b0.value == \"1\"\n    define b1: Token as toks2[1]\n    assert b1.kind == \"operator\"\n    assert b1.value == \".\"\n    define b2: Token as toks2[2]\n    assert b2.kind == \"identifier\"\n    assert b2.value == \"foo\"\n    define list toks3 as tokenize(\".42\")\n    assert length of toks3 == 2\n    define c0: Token as toks3[0]\n    assert c0.kind == \"operator\"\n    assert c0.value == \".\"\n    define c1: Token as toks3[1]\n    assert c1.kind == \"int\"\n    assert c1.value == \"42\"\n    define list toks4 as tokenize(\"3.14.15\")\n    assert length of toks4 == 3\n    define d0: Token as toks4[0]\n    assert d0.kind == \"float\"\n    assert d0.value == \"3.14\"\n    define d1: Token as toks4[1]\n    assert d1.kind == \"operator\"\n    assert d1.value == \".\"\n    define d2: Token as toks4[2]\n    assert d2.kind == \"int\"\n    assert d2.value == \"15\"",
